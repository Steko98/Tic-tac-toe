<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Tic-Tac-Toe</title>
</head>

<body>
    <div class="player-box p1">
        <h1 id="p1-name">Player X</h1>
        <p id="p1-wins">Wins: 0</p>
        <button id="change-p1">Change name</button>
    </div>
    <div class="game">
        <div id="container">
            <div id="game-over" class="hide">
            </div>
        </div>
        <button id="reset">Reset</button>
    </div>
    <div class="player-box p2">
        <h1 id="p2-name">Player O</h1>
        <p id="p2-wins">Wins: 0</p>
        <button id="change-p2">Change name</button>
    </div>
    <script src="./app.js"></script>
</body>

</html>
